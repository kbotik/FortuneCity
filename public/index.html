<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="FORTUNECITY_WS_URL" content="wss://ws.fortunecityplay.fr">
<title>FortuneCity</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon">🏙️</span>
    <strong>FortuneCity</strong>
  </div>
  <div class="bank">💰 <span id="money">1 500</span> €</div>
</header>

<main>

<section id="modeHome" class="mode-home">
  <div class="mode-home-icon">🏙️</div>
  <h1>FortuneCity</h1>
  <p>Choisis comment tu veux jouer.</p>
  <input id="homeCreateName" class="mode-home-name"
    maxlength="24" placeholder="Ton pseudo pour le mode online">
  <button id="playLocal" class="main-button">🎮 Jouer en local</button>
  <button id="createOnline" class="secondary-button">
    🏠 Créer une partie
  </button>
  <button id="showJoinOnline" class="tertiary-button">
    🔗 Rejoindre une partie
  </button>

  <div id="homeJoinForm" class="home-join-form hidden">
    <label for="homePlayerName">Pseudo</label>
    <input id="homePlayerName" maxlength="24" placeholder="Ton pseudo">
    <label for="homeRoomCode">Code de salle</label>
    <input id="homeRoomCode" maxlength="6" placeholder="ABC123"
      autocomplete="off">
    <button id="joinOnline" class="secondary-button">
      🔗 Rejoindre
    </button>
    <button id="cancelJoin" class="tertiary-button">
      Retour
    </button>
  </div>
</section>

<section id="playersPanel" class="players-panel mode-content-hidden">
  <div class="panel-title">👥 Joueurs</div>
  <div id="players"></div>
</section>

<section id="game" class="mode-content-hidden">

  <div id="board"></div>

  <section class="controls">

    <button id="roll" class="main-button">
      🎲 Lancer les dés
    </button>

    <div id="dice" class="dice-result">🎲 🎲</div>

    <div id="message" class="message">
      🎮 À toi de jouer !
    </div>

    <div id="action" class="action"></div>

    <button id="endTurn" class="secondary-button" disabled>
      ➡️ Terminer le tour
    </button>

    <button id="newGame" class="tertiary-button">
      🔄 Nouvelle partie
    </button>

  </section>

  <section class="log-panel">
    <h2>📜 Journal</h2>
    <div id="log"></div>
  </section>

</section>

</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div id="modalContent"></div>
    <button id="closeModal">OK</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
